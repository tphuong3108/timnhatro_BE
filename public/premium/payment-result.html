<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Kết quả thanh toán</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        font-family: sans-serif;
        background: #f5f6fa;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: white;
        max-width: 420px;
        margin: auto;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      }
      .status {
        font-size: 20px;
        margin-top: 10px;
        font-weight: bold;
      }
      .success {
        color: #27ae60;
      }
      .fail {
        color: #e74c3c;
      }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Kết quả Thanh Toán VNPay Premium</h2>
      <div id="status"></div>

      <button onclick="goBack()">Quay lại ứng dụng</button>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("orderId");

      async function loadStatus() {
        try {
          const res = await fetch(
            "/api/payment/check-status?orderId=" + orderId
          );
          const data = await res.json();

          const div = document.getElementById("status");
          const paymentStatus = data?.status;

          if (paymentStatus === "success") {
                div.innerHTML = "<p class='status success'>🎉 Thanh toán thành công!</p>";
                // Tự động redirect về app sau 2 giây
                setTimeout(() => goBack(true), 2000);
          } else {
              div.innerHTML = "<p class='status fail'>❌ Thanh toán thất bại!</p>";
              setTimeout(() => goBack(false), 2000);
          }

        } catch (e) {
          document.getElementById("status").innerHTML =
            "<p class='status fail'>Lỗi kiểm tra trạng thái thanh toán.</p>";
        }
      }

      function goBack(isSuccess) {
        const status = isSuccess ? 'success' : 'failed';
        // Thử mở deep link Expo app
        const deepLink = 'exp://192.168.1.15:8081/--/payment-result?status=' + status + '&orderId=' + orderId;
        window.location.href = deepLink;
        
        // Fallback: đóng tab sau 500ms nếu deep link không hoạt động
        setTimeout(() => {
          window.close();
          window.history.back();
        }, 500);
      }

      loadStatus();
    </script>
  </body>
</html>
